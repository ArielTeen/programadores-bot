<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo"><i class="bi bi-robot"></i></div>
            <h1 class="login-title">Bot Dashboard</h1>
            <p class="login-desc">Conecta con Discord para administrar tu servidor</p>

            {% if error %}
            <div style="background: var(--red-bg); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-exclamation-circle" style="color: var(--red);"></i>
                <span style="color: var(--red); font-size: 13px;">{{ error }}</span>
            </div>
            {% endif %}

            <a href="/login" class="btn-discord">
                <i class="bi bi-discord"></i>
                Iniciar sesion con Discord
            </a>

            <div class="login-footer">2026 Bot Dashboard</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
