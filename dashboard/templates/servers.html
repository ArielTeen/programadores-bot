{% extends "base.html" %}
{% block title %}Servidores{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Servidores</h1>
    <p style="color:var(--text-muted);font-size:13px;">Selecciona un servidor para gestionar su configuracion</p>
</div>

<div class="servers-grid">
    {% for g in guilds %}
    <a href="/dashboard/{{ g.id }}" style="text-decoration:none;color:inherit;">
        <div class="server-card">
            <img src="https://cdn.discordapp.com/icons/{{ g.id }}/{{ g.icon }}.png"
                 class="server-card-icon"
                 onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="server-card-info">
                <div class="server-card-name">{{ g.name[:28] }}</div>
                <div class="server-card-detail">
                    <span><i class="bi bi-people"></i> {{ g.member_count }} miembros</span>
                    <span class="{{ g.badge_class }}"><i class="bi bi-shield-check"></i> {{ g.permission_label }}</span>
                </div>
            </div>
            <i class="bi bi-chevron-right" style="color:var(--text-muted);"></i>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
